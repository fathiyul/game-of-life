<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conway's Game of Life</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Top control bar -->
  <div class="topbar">
    <span class="title">Conway's Game of Life</span>
    <div class="controls">
      <button id="play">Pause</button>
      <button id="randomize">Randomize</button>
      <button id="clear">Clear</button>
      <button id="rotate" title="Rotate brush (R)">Rotate</button>
      <label class="slider">Speed
        <input type="range" id="speed" min="1" max="30" value="10" />
      </label>
      <span id="generation" class="status">Generation: 0</span>
    </div>
    <span id="brush-name" class="status">Brush: Single Cell</span>
  </div>

  <!-- Pattern gallery -->
  <aside id="gallery" class="gallery"></aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
